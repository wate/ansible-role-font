---
- name: Set BIZTER install version variable
  when: font_bizter_version == 'latest'
  block:
    - name: Get latest version
      ansible.builtin.include_tasks:
        file: tasks/common/get_latest_version.yml
      vars:
        github_repo: "{{ font_bizter_repo }}"
        target_name: BIZTER
    - name: Set package version variable
      ansible.builtin.set_fact:
        font_bizter_version: "{{ latest_version }}"
- name: Set asset file variable
  ansible.builtin.set_fact:
    asset_file: BIZTER_{{ font_bizter_version }}.zip
- name: Create BIZTER font install directory
  ansible.builtin.file:
    path: "{{ font_dir }}/BIZTER"
    state: directory
    mode: "0755"
- name: Install BizinGothic font
  ansible.builtin.unarchive:
    src: https://github.com/{{ font_bizter_version }}/releases/download/{{ font_bizter_version }}/{{ asset_file }}
    dest: "{{ font_dir }}/BIZTER"
    extra_opts:
      - -j
    remote_src: true
- name: Install BizinGothic Discord font
  ansible.builtin.unarchive:
    src: https://github.com/{{ font_bizingothic_repo }}/releases/download/{{ font_bizingothic_version }}/{{ discord_asset_file }}
    dest: "{{ font_dir }}/BizinGothic"
    extra_opts:
      - -j
    remote_src: true
