---
- name: Set FontAwesome install version variable
  when: font_fontawesome_version == 'latest'
  block:
    - name: Get latest version
      ansible.builtin.include_tasks:
        file: tasks/common/get_latest_version.yml
      vars:
        github_repo: "{{ font_fontawesome_repo }}"
        target_name: FontAwesome
    - name: Set package version variable
      ansible.builtin.set_fact:
        font_fontawesome_version: "{{ latest_version }}"
- name: Set asset file variable
  ansible.builtin.set_fact:
    asset_file: fontawesome-free-{{ font_fontawesome_version }}-desktop.zip
    font_fontawesome_major_version: "{{ (font_fontawesome_version | split('.'))[0] }}"
- name: Create Font Awesome font install directory
  ansible.builtin.file:
    path: "{{ font_dir }}/FontAwesome"
    state: directory
    mode: "0755"
- name: Install Font Awesome font
  ansible.builtin.unarchive:
    src: https://github.com/{{ font_fontawesome_repo }}/releases/download/{{ font_fontawesome_version }}/{{ asset_file }}
    dest: "{{ font_dir }}/FontAwesome"
    include:
      - fontawesome-free-{{ font_fontawesome_version }}-desktop/otfs/Font Awesome {{ font_fontawesome_major_version }} Brands-Regular-400.otf
      - fontawesome-free-{{ font_fontawesome_version }}-desktop/otfs/Font Awesome {{ font_fontawesome_major_version }} Free-Regular-400.otf
      - fontawesome-free-{{ font_fontawesome_version }}-desktop/otfs/Font Awesome {{ font_fontawesome_major_version }} Free-Solid-900.otf
    extra_opts:
      - -j
    remote_src: true
